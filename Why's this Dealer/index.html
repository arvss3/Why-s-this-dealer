<!DOCTYPE html>
<html>
<head>
    <title>Bouncing Yaris</title>
    
    <!-- This adds the car emoji to your browser tab title icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">

    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        /* Fixed image styling so the Yaris scales dynamically and stays visible */
        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Removed hardcoded width/height attributes so the CSS styles can handle sizing perfectly -->
    <img src="https://tenor.com" alt="Bouncing Yaris">

    <script>
        const yarisMusic = new Audio("for30minutes.mp3");
        yarisMusic.loop = true;

        // Try to play immediately
        yarisMusic.play().catch(() => {
            console.log("Autoplay blocked. Click anywhere on the webpage to start the music.");
        });

        // Play immediately on the very first click anywhere on the screen
        window.addEventListener('click', () => {
            yarisMusic.play();
        }, { once: true });
    </script>

</body>
</html>
