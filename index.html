<!DOCTYPE html>
<html>
<head>
    <title>Bouncing Yaris</title>
    
    <!-- Car emoji title icon for the browser tab -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">

    <style>
        body {
            margin: 0;
            background-color: #000; /* Clean black background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer; /* Shows you can click anywhere to start */
        }

        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Just the bouncing Yaris GIF -->
    <img src="https://tenor.com" alt="Bouncing Yaris">

    <script>
        // Set up the looping background track
        const yarisMusic = new Audio("for30minutes.mp3");
        yarisMusic.loop = true;

        // Try to play immediately if the browser allows it
        yarisMusic.play().catch(() => {
            console.log("Waiting for user click to play audio.");
        });

        // Plays instantly when you click anywhere on the page
        window.addEventListener('click', () => {
            yarisMusic.play();
        }, { once: true });
    </script>

</body>
</html>
